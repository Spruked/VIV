name: VIV branch sanity

on:
  push:
    branches: [crm-dossier-refinement, crm-local-integration]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install VIV frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build VIV frontend
        working-directory: frontend
        run: npm run build

  python-syntax-and-schema-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile VIV API and migrations
        run: python -m compileall -q source/cali_skg/api source/cali_skg/core source/cali_skg/migrations
      - name: Run VIV relationship and communications substrate tests
        run: python source/tests/test_relationship_schema.py
